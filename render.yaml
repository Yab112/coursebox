# Render Blueprint: the CourseBox API (server/).
# Every deployment-specific value (database, bucket, keys, URLs) is entered in the Render dashboard (sync: false);
# nothing about a particular deployment is committed here.
services:
  - type: web
    name: coursebox-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SCHEMA
        value: coursebox
      - key: RUN_MIGRATIONS
        value: "true"
      - key: CORS_ORIGINS
        sync: false # your web app URL(s), comma separated
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_API_URL
        sync: false # this service's public URL
      - key: SIGNING_SECRET
        generateValue: true
      - key: COURSE_LIMIT
        value: "2"
      - key: MAX_COURSE_BYTES
        value: "2147483648"
